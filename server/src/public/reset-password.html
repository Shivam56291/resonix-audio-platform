<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Resonix</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Loader -->
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <p>Please wait...</p>
    </div>

    <!-- Main Card -->
    <div id="container" class="card">
      <img src="logo.png" alt="Resonix Logo" class="logo" />

      <h2>Reset your password</h2>
      <p class="subtitle">
        Create a new strong password for your account.
      </p>

      <form id="form" novalidate>
        <div class="notification-container error" id="error"></div>
        <div class="notification-container success" id="success"></div>

        <div class="form-group">
          <label for="password">New Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter new password"
            autocomplete="new-password"
            required
          />
          <small class="hint">
            At least 8 characters, uppercase, lowercase, number & symbol
          </small>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Re-enter new password"
            autocomplete="new-password"
            required
          />
        </div>

        <button id="submit" type="submit">Reset Password</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
